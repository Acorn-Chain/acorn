syntax = "proto3";
package acorn.acorn;

// this line is used by starport scaffolding # genesis/proto/import
import "gogoproto/gogo.proto";

option go_package = "github.com/acorn-chain/acorn/x/acorn/types";

// Params defines the parameters for the acorn module.
message Params {
  // max_supply defines the max supply of acorn coin.
  string max_supply = 1 [(gogoproto.moretags) = "yaml:\"max_supply\""];
  repeated string exclude_circulating_addr = 2 [(gogoproto.moretags) = "yaml:\"exclude_circulating_addr\""];
}